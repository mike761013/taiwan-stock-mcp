name: Backfill all Taiwan stock history

on:
  workflow_dispatch:
    inputs:
      years:
        description: "回補年數（1-10）"
        required: true
        default: "1"
      batch_size:
        description: "每批股票數（建議 20）"
        required: true
        default: "20"
      concurrency:
        description: "同時處理數（免費版建議 3-6）"
        required: true
        default: "6"
      start_after:
        description: "續傳股票代號；第一次請留空"
        required: false
        default: ""
      max_symbols:
        description: "最多處理幾檔；0 代表全部"
        required: true
        default: "0"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCK_DB_ENABLED: "true"
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database coverage before backfill
        run: |
          python scripts/check_stock_coverage.py

      - name: Run full-market backfill
        run: |
          python scripts/backfill_all_market_once.py \
            --years "${{ inputs.years }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --start-after "${{ inputs.start_after }}" \
            --max-symbols "${{ inputs.max_symbols }}"

      - name: Check database coverage after backfill
        if: always()
        run: |
          python scripts/check_stock_coverage.py

      - name: Upload checkpoint and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-backfill-report
          path: |
            backfill_checkpoint.json
            backfill_failures.json
          if-no-files-found: ignore
          retention-days: 14
