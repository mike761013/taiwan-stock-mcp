name: Repair missing Taiwan stock history

on:
  workflow_dispatch:
    inputs:
      years:
        description: "回補年數（1-10）"
        required: true
        default: "1"
      request_delay_seconds:
        description: "每檔之間等待秒數"
        required: true
        default: "10"
      retries:
        description: "單檔最多重試次數"
        required: true
        default: "3"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STOCK_DB_ENABLED: "true"
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check coverage before repair
        run: python scripts/check_stock_coverage.py

      - name: Repair only symbols without bars
        run: |
          python scripts/repair_missing_stock_history.py \
            --years "${{ inputs.years }}" \
            --request-delay "${{ inputs.request_delay_seconds }}" \
            --retries "${{ inputs.retries }}"

      - name: Check coverage after repair
        if: always()
        run: python scripts/check_stock_coverage.py

      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-stock-repair-report
          path: |
            repair_targets.json
            repair_checkpoint.json
            repair_failures.json
          if-no-files-found: ignore
          retention-days: 14
